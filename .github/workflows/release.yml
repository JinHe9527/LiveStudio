name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400

      - name: 验证版本标签
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "版本标签必须使用 v主版本.次版本.修订号"
          }

      - name: 还原并测试
        shell: pwsh
        run: |
          dotnet restore LiveStudio.slnx
          dotnet build LiveStudio.slnx --configuration Release --no-restore --nologo
          dotnet test tests/LiveStudio.Core.Tests/LiveStudio.Core.Tests.csproj --configuration Release --no-build --nologo

      - name: 发布 Windows x64
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $packageRoot = Join-Path $PWD 'artifacts\LiveStudio'
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          dotnet publish src/LiveStudio.Desktop/LiveStudio.Desktop.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:Version=$version -o (Join-Path $packageRoot 'Desktop')
          dotnet publish src/LiveStudio.Agent/LiveStudio.Agent.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:Version=$version -o (Join-Path $packageRoot 'Agent')
          @'
          @echo off
          setlocal
          start "" "%~dp0Desktop\LiveStudio.Desktop.exe"
          endlocal
          '@ | Set-Content -Encoding ascii (Join-Path $packageRoot '启动 LiveStudio.cmd')
          @'
          解压整个目录后双击“启动 LiveStudio.cmd”。
          软件设置位于窗口左下角。GitHub 私有仓库更新需要保存一次 Fine-grained Token，之后可在软件内检查、安装并重启。
          '@ | Set-Content -Encoding utf8 (Join-Path $packageRoot '使用说明.txt')
          $archive = Join-Path $PWD 'artifacts\LiveStudio-Windows-x64.zip'
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  LiveStudio-Windows-x64.zip" | Set-Content -Encoding ascii "$archive.sha256"

      - name: 创建 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts/LiveStudio-Windows-x64.zip `
            artifacts/LiveStudio-Windows-x64.zip.sha256 `
            --title "LiveStudio ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag
