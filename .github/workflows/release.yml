name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400

      - name: 验证版本标签
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "版本标签必须使用 v主版本.次版本.修订号"
          }

      - name: 还原并测试
        shell: pwsh
        run: |
          dotnet restore LiveStudio.slnx
          dotnet build LiveStudio.slnx --configuration Release --no-restore --nologo
          dotnet test LiveStudio.slnx --configuration Release --no-build --nologo
          dotnet format LiveStudio.slnx --verify-no-changes --no-restore
          dotnet list LiveStudio.slnx package --vulnerable --include-transitive

      - name: 导入内部代码签名证书
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.LIVESTUDIO_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.LIVESTUDIO_SIGNING_PFX_PASSWORD }}
          EXPECTED_PUBLISHER: ${{ secrets.LIVESTUDIO_SIGNING_PUBLISHER }}
        run: |
          if (-not $env:SIGNING_PFX_BASE64 -or -not $env:SIGNING_PFX_PASSWORD -or -not $env:EXPECTED_PUBLISHER) {
            throw '缺少 MSIX 签名 Secrets'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'LiveStudio-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate -or $certificate.Subject -ne $env:EXPECTED_PUBLISHER) {
            throw '签名证书 Subject 与固定 Publisher 不一致'
          }
          $publicCertificatePath = Join-Path $PWD 'artifacts\LiveStudio-Signing.cer'
          New-Item -ItemType Directory -Path (Split-Path $publicCertificatePath) -Force | Out-Null
          Export-Certificate -Cert $certificate -FilePath $publicCertificatePath -Type CERT | Out-Null
          Import-Certificate -FilePath $publicCertificatePath -CertStoreLocation Cert:\CurrentUser\TrustedPeople | Out-Null
          "LIVESTUDIO_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 构建并验证签名 MSIX
        shell: pwsh
        env:
          PACKAGE_PUBLISHER: ${{ secrets.LIVESTUDIO_SIGNING_PUBLISHER }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v') + '.0'
          $output = Join-Path $PWD 'artifacts\msix'
          $package = .\deploy\windows\Build-Msix.ps1 `
            -Version $version `
            -Architecture x64 `
            -Publisher $env:PACKAGE_PUBLISHER `
            -CertificateThumbprint $env:LIVESTUDIO_CERTIFICATE_THUMBPRINT `
            -TimestampUrl 'http://timestamp.digicert.com' `
            -UpdateManifestUrl 'https://wuyoupaiban.cn/livestudio/latest.json' `
            -OutputDirectory $output | Select-Object -Last 1
          $releasePackage = Join-Path $PWD 'artifacts\LiveStudio-Windows-x64.msix'
          Copy-Item -LiteralPath $package -Destination $releasePackage
          $hash = (Get-FileHash -Algorithm SHA256 $releasePackage).Hash.ToLowerInvariant()
          "$hash  LiveStudio-Windows-x64.msix" | Set-Content -Encoding ascii "$releasePackage.sha256"
          .\deploy\windows\Test-InternalMsixSignature.ps1 `
            -PackagePath $releasePackage `
            -ExpectedCertificateThumbprint $env:LIVESTUDIO_CERTIFICATE_THUMBPRINT `
            -ReportPath (Join-Path $PWD 'artifacts\LiveStudio-Windows-x64.signature.txt')

      - name: 构建并验证一键安装器
        shell: pwsh
        run: |
          $setup = .\deploy\windows\Build-Setup.ps1 `
            -PackagePath (Join-Path $PWD 'artifacts\LiveStudio-Windows-x64.msix') `
            -ChecksumPath (Join-Path $PWD 'artifacts\LiveStudio-Windows-x64.msix.sha256') `
            -CertificatePath (Join-Path $PWD 'artifacts\LiveStudio-Signing.cer') `
            -CertificateThumbprint $env:LIVESTUDIO_CERTIFICATE_THUMBPRINT `
            -TimestampUrl 'http://timestamp.digicert.com' `
            -OutputDirectory (Join-Path $PWD 'artifacts') | Select-Object -Last 1
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          "$hash  LiveStudio-Setup.exe" | Set-Content -Encoding ascii "$setup.sha256"

      - name: 创建 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts/LiveStudio-Setup.exe `
            artifacts/LiveStudio-Setup.exe.sha256 `
            artifacts/LiveStudio-Setup.signature.txt `
            artifacts/LiveStudio-Windows-x64.msix `
            artifacts/LiveStudio-Windows-x64.msix.sha256 `
            artifacts/LiveStudio-Windows-x64.signature.txt `
            artifacts/LiveStudio-Signing.cer `
            --title "LiveStudio ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag

      - name: 验证国内固定下载与软件内更新
        shell: pwsh
        run: |
          $expectedTag = '${{ github.ref_name }}'
          $manifestUrl = 'https://wuyoupaiban.cn/livestudio/latest.json'
          $manifest = $null
          for ($attempt = 1; $attempt -le 90; $attempt++) {
            try {
              $manifestRequestUrl = '{0}?attempt={1}' -f $manifestUrl, $attempt
              $manifest = Invoke-RestMethod $manifestRequestUrl -TimeoutSec 20
              if ($manifest.tagName -eq $expectedTag) { break }
            }
            catch {
              if ($attempt -eq 90) { throw }
            }
            Start-Sleep -Seconds 10
          }
          if (-not $manifest -or $manifest.tagName -ne $expectedTag) {
            throw "国内更新镜像未在期限内同步 $expectedTag"
          }
          foreach ($url in @($manifest.packageUrl, $manifest.checksumUrl)) {
            $uri = [Uri]$url
            if ($uri.Scheme -ne 'https' -or $uri.Host -ne 'wuyoupaiban.cn') {
              throw "国内更新清单包含不受信任的地址：$url"
            }
          }
          $downloadedSetup = Join-Path $env:RUNNER_TEMP 'LiveStudio-Domestic-Setup.exe'
          $downloadedChecksum = "$downloadedSetup.sha256"
          Invoke-WebRequest $manifest.packageUrl -OutFile $downloadedSetup -TimeoutSec 1800
          Invoke-WebRequest $manifest.checksumUrl -OutFile $downloadedChecksum -TimeoutSec 60
          $expectedHash = (Get-Content -LiteralPath $downloadedChecksum -Raw).Split()[0]
          $actualHash = (Get-FileHash -LiteralPath $downloadedSetup -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw '国内更新安装器回下载 SHA-256 不一致'
          }
          .\deploy\windows\Test-InternalAuthenticodeSignature.ps1 `
            -SignedFilePath $downloadedSetup `
            -ExpectedCertificateThumbprint $env:LIVESTUDIO_CERTIFICATE_THUMBPRINT `
            -ReportPath (Join-Path $env:RUNNER_TEMP 'LiveStudio-Domestic.signature.txt')
          $verificationProcess = Start-Process `
            -FilePath $downloadedSetup `
            -ArgumentList '--verify-only' `
            -WindowStyle Hidden `
            -PassThru
          if (-not $verificationProcess.WaitForExit(60000)) {
            Stop-Process -Id $verificationProcess.Id -Force -ErrorAction SilentlyContinue
            throw '国内更新安装器自检超时'
          }
          if ($verificationProcess.ExitCode -ne 0) {
            throw '国内更新安装器自检失败'
          }
