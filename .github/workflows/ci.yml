name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: livestudio_integration
          POSTGRES_USER: livestudio
          POSTGRES_PASSWORD: integration-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U livestudio -d livestudio_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400

      - name: 启动 MinIO
        run: >-
          docker run --detach --name livestudio-minio
          --publish 9000:9000
          --env MINIO_ROOT_USER=integrationadmin
          --env MINIO_ROOT_PASSWORD=integration-secret-minimum
          quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
          server /data --address :9000

      - name: 创建测试 Bucket
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs livestudio-minio
              exit 1
            fi
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z \
            -c 'mc alias set integration http://127.0.0.1:9000 integrationadmin integration-secret-minimum && mc mb --ignore-existing integration/livestudio'

      - name: 还原依赖
        run: |
          dotnet restore LiveStudio.slnx
          dotnet restore LiveStudio.Integration.slnx

      - name: 编译
        run: |
          dotnet build LiveStudio.slnx --configuration Release --no-restore --nologo
          dotnet build tests/LiveStudio.Cloud.IntegrationTests/LiveStudio.Cloud.IntegrationTests.csproj --configuration Release --no-restore --nologo

      - name: 单元与协议测试
        run: dotnet test tests/LiveStudio.Core.Tests/LiveStudio.Core.Tests.csproj --configuration Release --no-build --nologo

      - name: PostgreSQL 与 MinIO 集成测试
        env:
          LIVESTUDIO_INTEGRATION_CONNECTION: Host=127.0.0.1;Port=5432;Database=livestudio_integration;Username=livestudio;Password=integration-postgres-password
          LIVESTUDIO_INTEGRATION_S3_URL: http://127.0.0.1:9000
          LIVESTUDIO_INTEGRATION_S3_REGION: us-east-1
          LIVESTUDIO_INTEGRATION_S3_BUCKET: livestudio
          LIVESTUDIO_INTEGRATION_S3_ACCESS_KEY: integrationadmin
          LIVESTUDIO_INTEGRATION_S3_SECRET_KEY: integration-secret-minimum
        run: dotnet test tests/LiveStudio.Cloud.IntegrationTests/LiveStudio.Cloud.IntegrationTests.csproj --configuration Release --no-build --nologo
